name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node-and-preparation:
    runs-on: ubuntu-latest
    env:
      VIET_TTS_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build:plugin
      - run: npm run check
